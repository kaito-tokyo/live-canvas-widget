name: Plugin CI

# file: .github/workflows/plugin.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-06-29

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    tags: ['*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-build-macos:
    permissions:
      contents: read
    uses: ./.github/workflows/plugin-build-macos.yml
    with:
      environment: ${{ github.event_name == 'push' && 'production-macos' || '' }}
      VCPKG_BINARY_SOURCES: clear;http,https://vcpkg-obs.kaito.tokyo/{name}/{version}/{sha},read
    secrets: inherit

  accept-plugin:
    if: always()
    needs:
      - plugin-build-macos
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check the workflow result
        run: |
          [[ "${{ needs.plugin-build-macos.result }}" == 'success' ]]
